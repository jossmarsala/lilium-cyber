    <circle cx="24" cy="21" r="6" fill="#ff5f56"/>
    <circle cx="44" cy="21" r="6" fill="#ffbd2e"/>
    <circle cx="64" cy="21" r="6" fill="#27c93f"/>

    <text x="220" y="26" text-anchor="middle" font-family="monospace" font-size="12" fill="#8892b0">lilium-cyber-range ~ bash</text>

    <!-- Terminal Content -->
    <g transform="translate(24, 70)" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="13">
      <text y="0" fill="#64748b"># Inicializando entorno seguro v2.4...</text>
      
      <text y="30" fill="#00ff66">guest@lilium:~$</text>
      <text x="140" y="30" fill="#ffffff">./run-security-audit.sh</text>

      <text y="64" fill="#38bdf8">[*] Analizando 6 capas de defensa:</text>
      <text y="92" fill="#94a3b8">  [✓] 01. COMPRENDER   (Lineamientos y Riesgo)</text>
      <text y="118" fill="#94a3b8">  [✓] 02. DESCUBRIR    (Inventario de Activos)</text>
      <text y="144" fill="#94a3b8">  [✓] 03. DISENAR      (Arquitectura Zero Trust)</text>
      <text y="170" fill="#94a3b8">  [✓] 04. PROTEGER     (Hardening y Credenciales)</text>
      <text y="196" fill="#94a3b8">  [✓] 05. DETECTAR     (Telemetría y Syslog)</text>
      <text y="222" fill="#94a3b8">  [✓] 06. RESPONDER    (Contención de Incidentes)</text>

      <!-- Simulated Alert Card -->
      <g transform="translate(0, 246)">
        <rect width="392" height="66" rx="8" fill="rgba(0, 255, 102, 0.08)" stroke="rgba(0, 255, 102, 0.25)" stroke-width="1"/>
        <text x="14" y="26" fill="#00ff66" font-weight="700">VERIFICACIÓN COMPLETADA (100%)</text>
        <text x="14" y="48" fill="#cbd5e1" font-size="12">Infraestructura blindada y playbooks validados.</text>
      </g>

      <text y="340" fill="#00ff66">guest@lilium:~$</text>
      <rect x="140" y="328" width="8" height="15" fill="#00ff66">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>

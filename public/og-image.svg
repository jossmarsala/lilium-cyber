      <text x="18" y="23" font-family="monospace" font-size="13" font-weight="600" fill="#e2e8f0">NIST CSF 2.0</text>

      <!-- Badge 2: CIS Controls -->
      <rect x="140" y="0" width="140" height="36" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
      <text x="156" y="23" font-family="monospace" font-size="13" font-weight="600" fill="#e2e8f0">CIS Controls v8</text>

      <!-- Badge 3: OWASP -->
      <rect x="292" y="0" width="94" height="36" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
      <text x="310" y="23" font-family="monospace" font-size="13" font-weight="600" fill="#e2e8f0">OWASP</text>

      <!-- Badge 4: MITRE ATT&CK -->
      <rect x="398" y="0" width="138" height="36" rx="18" fill="rgba(0, 255, 102, 0.12)" stroke="rgba(0, 255, 102, 0.3)"/>
      <circle cx="414" cy="18" r="4" fill="#00ff66"/>
      <text x="426" y="23" font-family="monospace" font-size="13" font-weight="700" fill="#00ff66">MITRE ATT&amp;CK</text>
    </g>

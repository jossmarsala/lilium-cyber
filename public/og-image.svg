<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d12"/>
      <stop offset="50%" stop-color="#07080a"/>
      <stop offset="100%" stop-color="#040507"/>
    </linearGradient>

    <!-- Neon Glow Accents -->
    <radialGradient id="glowTopRight" cx="80%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0.16"/>
      <stop offset="50%" stop-color="#00bb55" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowBottomLeft" cx="15%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.035)" stroke-width="1"/>
    </pattern>

    <!-- Linear Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.06)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.01)"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#cyberGrid)"/>
  <circle cx="950" cy="180" r="450" fill="url(#glowTopRight)"/>
  <circle cx="200" cy="500" r="380" fill="url(#glowBottomLeft)"/>

  <!-- Subtle Outer Border -->
  <rect x="20" y="20" width="1160" height="590" rx="24" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" fill="none"/>

  <!-- Left Side: Brand & Value Proposition -->
  <g transform="translate(80, 90)">
    <!-- Brand Header -->
    <g transform="translate(0, 0)">
      <!-- Lilium Logo SVG path (simplified & sharp) -->
      <g transform="translate(0, 0) scale(0.18)">
        <path fill="#00ff66" d="M265.29,35.32l-30.44,91.33c-1.85,5.56,3.44,10.85,9,9l91.33-30.44c2.12-.71,3.79-2.38,4.5-4.5l30.44-91.33c1.85-5.56-3.44-10.85-9-9l-91.33,30.44c-2.12.71-3.79,2.38-4.5,4.5Z"/>
        <path fill="#ffffff" d="M100.7,30.81L9.38.38C3.82-1.48-1.48,3.82.38,9.38l30.44,91.33c.71,2.12,2.38,3.79,4.5,4.5l91.33,30.44c5.56,1.85,10.85-3.44,9-9l-30.44-91.33c-.71-2.12-2.38-3.79-4.5-4.5Z"/>
        <path fill="#ffffff" d="M335.18,265.29l-91.33-30.44c-5.56-1.85-10.85,3.44-9,9l30.44,91.33c.71,2.12,2.38,3.79,4.5,4.5l91.33,30.44c5.56,1.85,10.85-3.44,9-9l-30.44-91.33c-.71-2.12-2.38-3.79-4.5-4.5Z"/>
        <path fill="#00ff66" d="M265.42,196.17c0,3.93,3.19,7.12,7.12,7.12h57.91c3.93,0,7.12-3.19,7.12-7.12v-21.84c0-3.93-3.19-7.12-7.12-7.12h-57.91c-3.93,0-7.12,3.19-7.12,7.12v21.84Z"/>
        <path fill="#ffffff" d="M232.24,167.21h-21.84c-3.93,0-7.12-3.19-7.12-7.12v-21.84c0-3.93-3.19-7.12-7.12-7.12h-21.84c-3.93,0-7.12,3.19-7.12,7.12v21.84c0,3.93-3.19,7.12-7.12,7.12h-21.84c-3.93,0-7.12,3.19-7.12,7.12v21.84c0,3.93,3.19,7.12,7.12,7.12h21.84c3.93,0,7.12,3.19,7.12,7.12v21.84c0,3.93,3.19,7.12,7.12,7.12h21.84c3.93,0,7.12-3.19,7.12-7.12v-21.84c0-3.93,3.19-7.12,7.12-7.12h21.84c3.93,0,7.12-3.19,7.12-7.12v-21.84c0-3.93-3.19-7.12-7.12-7.12Z"/>
        <path fill="#00ff66" d="M105.21,335.18l30.44-91.33c1.85-5.56-3.44-10.85-9-9l-91.33,30.44c-2.12.71-3.79,2.38-4.5,4.5L.38,361.12c-1.85,5.56,3.44,10.85,9,9l91.33-30.44c2.12-.71,3.79-2.38,4.5-4.5Z"/>
        <path fill="#ffffff" d="M167.22,301.48v28.95c0,3.93,3.19,7.12,7.12,7.12h21.84c3.93,0,7.12-3.19,7.12-7.12v-57.91c0-3.93-3.19-7.12-7.12-7.12h-21.84c-3.93,0-7.12,3.19-7.12,7.12v28.95Z"/>
        <path fill="#ffffff" d="M203.29,69.01v-28.95c0-3.93-3.19-7.12-7.12-7.12h-21.84c-3.93,0-7.12,3.19-7.12,7.12v57.91c0,3.93,3.19,7.12,7.12,7.12h21.84c3.93,0,7.12-3.19,7.12-7.12v-28.95Z"/>
        <path fill="#00ff66" d="M32.95,196.17c0,3.93,3.19,7.12,7.12,7.12h57.9c3.93,0,7.12-3.19,7.12-7.12v-21.84c0-3.93-3.19-7.12-7.12-7.12h-57.9c-3.93,0-7.12,3.19-7.12,7.12v21.84Z"/>

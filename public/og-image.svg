    </text>

    <!-- Subtitle description -->
    <text x="0" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="20" fill="#a0a5b5" letter-spacing="-0.2px">
      Guía prescriptiva por capas con laboratorios interactivos
